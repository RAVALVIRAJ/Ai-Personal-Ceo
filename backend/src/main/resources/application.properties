spring.application.name=ai-personal-ceo-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_personal_ceo}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.reminders.enabled=${REMINDERS_ENABLED:true}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

# Reminder email (configure SMTP_* and REMINDER_EMAIL_* in the environment)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
app.reminders.email-from=${REMINDER_EMAIL_FROM:${SMTP_USERNAME:}}
app.reminders.email-to=${REMINDER_EMAIL_TO:}

# Connection pool (Hikari)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=240000

