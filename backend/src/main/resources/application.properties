spring.application.name=ai-personal-ceo-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_personal_ceo}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

# Reminder email (configure SMTP_* and REMINDER_EMAIL_* in the environment)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
app.reminders.email-from=${REMINDER_EMAIL_FROM:${SMTP_USERNAME:}}
app.reminders.email-to=${REMINDER_EMAIL_TO:}